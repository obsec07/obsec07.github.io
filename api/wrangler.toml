# Local development: `npx wrangler dev` in this folder (a local database, nothing is uploaded).
# Production deploys don't use this file as is: deploy.mjs (run by .github/workflows/pages.yml) creates the database,
# fills in its id and the variables below, and deploys.
name = "secblog-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "secblog"
database_id = "local"

[triggers]
crons = ["17 3 * * *"]   # daily clean-up of old visits

[vars]
SITE_URL = ""            # the blog, e.g. https://obsec07.github.io (comments only on its posts, CORS)
ALLOWED_ORIGINS = "*"    # extra sites allowed to call the API; production allows only SITE_URL
GITHUB_REPO = ""         # owner/repo: /admin's GitHub token must be able to write here
OWNER_NAME = ""          # guests can't comment under this name
RETENTION_DAYS = "90"
