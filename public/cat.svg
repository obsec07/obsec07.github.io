<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="cat">
  <!-- owner/admin avatar: ginger cat in a bow tie -->
  <rect width="128" height="128" fill="#e9dfcf"/>
  <circle cx="64" cy="64" r="58" fill="#d9ccb7"/>
  <!-- ears -->
  <path d="M22 50 L30 12 L56 34 Z" fill="#e0893a"/>
  <path d="M106 50 L98 12 L72 34 Z" fill="#e0893a"/>
  <path d="M30 42 L33 22 L48 35 Z" fill="#f4b3a6"/>
  <path d="M98 42 L95 22 L80 35 Z" fill="#f4b3a6"/>
  <!-- head -->
  <ellipse cx="64" cy="64" rx="44" ry="38" fill="#f09d4a"/>
  <!-- forehead stripes -->
  <path d="M64 27 v13 M55 29 l3 11 M73 29 l-3 11" stroke="#c96f25" stroke-width="4" stroke-linecap="round"/>
  <path d="M22 60 h10 M21 69 h10 M106 60 h-10 M107 69 h-10" stroke="#c96f25" stroke-width="3.5" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="54" cy="80" rx="13" ry="10" fill="#fff4e4"/>
  <ellipse cx="74" cy="80" rx="13" ry="10" fill="#fff4e4"/>
  <!-- eyes -->
  <ellipse cx="46" cy="60" rx="8" ry="9" fill="#6cc27e"/>
  <ellipse cx="82" cy="60" rx="8" ry="9" fill="#6cc27e"/>
  <ellipse cx="46" cy="60" rx="2.6" ry="7.5" fill="#1b1f2a"/>
  <ellipse cx="82" cy="60" rx="2.6" ry="7.5" fill="#1b1f2a"/>
  <circle cx="49" cy="56" r="2" fill="#fff"/>
  <circle cx="85" cy="56" r="2" fill="#fff"/>
  <!-- nose + mouth -->
  <path d="M58 72 h12 l-6 6 z" fill="#e86f78"/>
  <path d="M64 78 v4 M64 82 q-5 5 -10 1 M64 82 q5 5 10 1" fill="none" stroke="#5a3a22" stroke-width="2" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M40 78 L14 74 M40 83 L15 86 M88 78 L114 74 M88 83 L113 86" stroke="#5a3a22" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
  <!-- bow tie -->
  <path d="M64 108 L44 99 L44 119 Z" fill="#1b1f2a"/>
  <path d="M64 108 L84 99 L84 119 Z" fill="#1b1f2a"/>
  <rect x="58" y="102" width="12" height="12" rx="3" fill="#2f3645"/>
